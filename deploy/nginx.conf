# /etc/nginx/sites-available/gooskin  (gooskin.mn-г өөрийн домэйноор солино)
# SSL: sudo certbot --nginx -d gooskin.mn -d www.gooskin.mn
server {
    listen 80;
    server_name gooskin.mn www.gooskin.mn;
    return 301 https://gooskin.mn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gooskin.mn;

    # certbot автоматаар бөглөнө
    # ssl_certificate     /etc/letsencrypt/live/gooskin.mn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gooskin.mn/privkey.pem;

    client_max_body_size 8m;   # зураг upload (6MB хүртэл)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
